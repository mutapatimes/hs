<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 272px; margin: 0; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fbfaf7; color: #1a1a1a; }
    .head { display: flex; align-items: center; gap: 9px; padding: 14px 16px 12px;
      background: #f4f1ea; border-bottom: 1px solid #eee7da; position: relative; }
    .mark { color: #1F564A; font-size: 17px; line-height: 1; }
    h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
    .sp { flex: 1; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #b9b2a2; }
    .dot.ok { background: #2e7d5b; }
    .head::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: linear-gradient(90deg, transparent 15%, #1F564A 40%, #6FBFA0 50%, #1F564A 60%, transparent 85%);
      background-size: 240% 100%; opacity: 0; transition: opacity .25s ease; }
    .head.checking::after { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .mark { animation: breathe 3.4s ease-in-out infinite; }
      .head.checking::after { animation: scan 1.5s linear infinite; }
      @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
      @keyframes scan { from { background-position: 130% 0; } to { background-position: -130% 0; } }
    }
    .body { padding: 14px 16px 16px; }
    p.lede { font-size: 12px; color: #6b6355; line-height: 1.5; margin: 0 0 12px; }
    .state { font-size: 12px; line-height: 1.45; padding: 8px 10px; border: 1px solid #e3ded3;
      background: #fff; margin-bottom: 12px; }
    .state.ok { border-color: #cfe0d8; color: #1F564A; }
    .state.bad { border-color: #e6cfc9; color: #a2453b; }
    button { width: 100%; font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 9px;
      border: 1px solid #1a1a1a; background: #1a1a1a; color: #fbfaf7; cursor: pointer; }
    button:hover { background: #333; }
    button:focus-visible { outline: 2px solid #1F564A; outline-offset: 1px; }
  </style>
</head>
<body>
  <div class="head checking" id="head">
    <span class="mark">⁂</span>
    <h1>Halia</h1>
    <span class="sp"></span>
    <span class="dot" id="dot"></span>
  </div>
  <div class="body">
    <p class="lede">Client grades, reasons and the next move, right where you work: store admin, WhatsApp Web, Gmail.</p>
    <div id="state" class="state">Checking…</div>
    <button id="open">Open settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>

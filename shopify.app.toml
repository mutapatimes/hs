# Shopify app config for the "HALIA" Partner app. Linked via `shopify app config link`; push
# changes with `shopify app deploy`. client_id is the app's public API key and MUST equal the
# backend's SHOPIFY_API_KEY.
#
# Install model: MANAGED install + token exchange (see halia/api/shopify_auth.py,
# halia/api/embedded.py), so use_legacy_install_flow = false is correct and the scopes below are
# what a merchant actually grants at install.

client_id = "813658d9fa7652961809f617b47f1c0b"
application_url = "https://haliascore.com"
embedded = true
name = "HALIA"

[access_scopes]
# read_orders + read_customers + read_products power scoring and the catalogue builder.
# write_customers lets Halia tag VICs back into Shopify (the outreach pipeline) — it was missing
# from the linked config, so adding it prompts a one-time re-approval on next app load.
# read_all_orders (full order history beyond ~60 days) is a PROTECTED scope: Shopify must approve it
# before it can be declared here, so it is intentionally omitted for now. Request it in the Partner
# Dashboard, then add it back and redeploy.
scopes = "read_customers,read_orders,write_customers,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://haliascore.com/connect/shopify/callback",
  "https://haliascore.com",
]

# Mandatory privacy/compliance webhooks — REQUIRED for public distribution. Handled HMAC-verified at
# POST /webhooks/shopify (halia/api/webhooks.py); Halia is zero-retention so the redacts are near
# no-ops and only shop/redact + app/uninstalled erase the little we persist.
[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://haliascore.com/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://haliascore.com/webhooks/shopify"

# Branded catalogue links served through Shopify's App Proxy at {store}/a/catalogue.
[app_proxy]
url = "https://haliascore.com/proxy/catalogue"
subpath = "catalogue"
prefix = "a"

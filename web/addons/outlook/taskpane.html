<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halia</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="__BASE__/static/halia-shape.js"></script>
<style>
  :root { --ink:#303030; --soft:#616161; --faint:#8a8a8a; --brand:#1f564a; --deep:#0e2e27;
          --line:#e3e3e3; --card:#fff; --bg:#f6f6f5; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif }
  .wrap { padding:12px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:12px 13px; margin-bottom:10px }
  h1 { font-size:15px; margin:0 0 8px; font-weight:600 }
  h2 { font-size:12px; margin:0 0 7px; font-weight:600; color:var(--soft) }
  p { margin:0 0 8px; color:var(--soft) }
  label { display:block; font:600 11.5px system-ui; color:var(--faint); margin:0 0 4px }
  input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; font:14px system-ui; color:var(--ink); background:#fff; outline:none }
  input:focus, select:focus, textarea:focus { border-color:var(--brand) }
  textarea { min-height:120px; resize:vertical }
  button { font:600 13px system-ui; cursor:pointer; border-radius:8px; padding:8px 12px;
           border:1px solid var(--line); background:#fff; color:var(--ink) }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff }
  button:disabled { opacity:.5; cursor:default }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .row > * { min-width:0 }
  .grow { flex:1 }
  .tabs { display:flex; gap:4px; margin-bottom:10px }
  .tabs button { flex:1; padding:7px 4px; font-size:12px }
  .tabs button[aria-selected="true"] { background:var(--deep); border-color:var(--deep); color:#fff }
  .who { font:600 14px system-ui }
  .note { font-size:12px; color:var(--faint) }
  .list { max-height:230px; overflow-y:auto; border:1px solid var(--line); border-radius:8px;
          background:#fff }
  .item { display:flex; gap:9px; align-items:flex-start; padding:8px 10px;
          border-bottom:1px solid var(--line); cursor:pointer }
  .item:last-child { border-bottom:0 }
  .item:hover { background:#fafafa }
  .item b { font-weight:600 }
  .item .sub { display:block; color:var(--faint); font-size:12px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .toggles { display:flex; gap:14px; margin:8px 0 }
  .toggles label { display:flex; gap:5px; align-items:center; font:13px system-ui; color:var(--soft) }
  .toggles input { width:auto }
  .err { color:#9a3838; font-size:12.5px }
  .ok { color:var(--brand); font-size:12.5px }
  .hide { display:none !important }
</style></head>
<body><div class="wrap">

  <!-- Connect: one paste, once per machine. Outlook no longer issues an identity token we could
       use to recognise the associate silently, so the seat token is entered by hand. -->
  <div class="card" id="connect">
    <h1>Connect Halia</h1>
    <p>Paste the sign-in your manager sent you.</p>
    <label for="tok">Sign-in</label>
    <input id="tok" type="password" autocomplete="off" spellcheck="false">
    <div class="row" style="margin-top:9px">
      <button class="primary" id="connectGo">Connect</button>
      <span id="connectMsg" class="note"></span>
    </div>
  </div>

  <div id="desk" class="hide">
    <div class="card">
      <div class="row">
        <span class="who grow" id="who">Reading the message…</span>
        <button id="signout" title="Sign out">Sign out</button>
      </div>
      <div class="note" id="whoNote"></div>
    </div>

    <div class="tabs" role="tablist">
      <button data-tab="templates" aria-selected="true">Templates</button>
      <button data-tab="draft" aria-selected="false">Draft</button>
      <button data-tab="pieces" aria-selected="false">Pieces</button>
      <button data-tab="book" aria-selected="false">Book</button>
    </div>

    <!-- Templates -->
    <div class="card" data-panel="templates">
      <div class="row">
        <select id="cat" class="grow"><option value="">All</option></select>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="greeting" checked> Greeting</label>
        <label><input type="checkbox" id="signoff" checked> Sign-off</label>
      </div>
      <div class="list" id="tplList"></div>
    </div>

    <!-- Draft -->
    <div class="card hide" data-panel="draft">
      <label for="ask">What should it say?</label>
      <div class="row">
        <input id="ask" class="grow" placeholder="a warm hello, nothing to sell">
        <button id="write">Write</button>
      </div>
      <div class="row" id="angles" style="margin:8px 0"></div>
      <textarea id="draftText" placeholder="The note appears here, and you can change it."></textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="insertDraft">Put it in the message</button>
        <span id="draftMsg" class="note"></span>
      </div>
    </div>

    <!-- Pieces -->
    <div class="card hide" data-panel="pieces">
      <div class="row">
        <input id="q" class="grow" placeholder="Search your products">
        <button id="search">Search</button>
      </div>
      <div class="row" style="margin:8px 0">
        <select id="fcol" class="grow"><option value="">All collections</option></select>
        <select id="fsize" class="grow"><option value="">All sizes</option></select>
        <button id="all">All</button>
      </div>
      <div class="list" id="prodList"></div>
      <div class="row" style="margin-top:9px">
        <button class="primary" id="sendSel">Add selection (0)</button>
        <span id="piecesMsg" class="note"></span>
      </div>
    </div>

    <!-- Book -->
    <div class="card hide" data-panel="book">
      <label for="when">When</label>
      <input id="when" type="datetime-local">
      <div class="row" style="margin-top:8px">
        <div class="grow"><label for="mins">How long</label>
          <select id="mins"><option value="30">30 min</option><option value="45" selected>45 min</option>
            <option value="60">1 hour</option><option value="90">1½ hours</option></select></div>
        <div class="grow"><label for="place">Where</label><input id="place"></div>
      </div>
      <div class="row" style="margin-top:9px">
        <button class="primary" id="bookGo">Book and add the invitation</button>
      </div>
      <div class="note" id="bookMsg" style="margin-top:7px"></div>
    </div>

    <div class="row" style="margin-top:2px">
      <button id="logged">Log that I contacted them</button>
      <span id="logMsg" class="note"></span>
    </div>
  </div>

</div>
<script src="__BASE__/addons/outlook/taskpane.js"></script>
</body></html>
